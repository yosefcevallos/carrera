# carrera-keeper configuration. Copy to keeper.toml.
rpc_url = "http://127.0.0.1:8899"
keypair_path = "~/.config/solana/keeper.json"
program_id = "11111111111111111111111111111111"        # carrera_overlay program id
usdc_mint = "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"
# kamino_reserve = "..."     # Kamino USDC reserve (live mode)
# treasury_shares = "..."    # share token account that receives performance fees; fees skipped when unset
hourly_interval_secs = 3600
fast_interval_secs = 60
# alert_webhook_url = "https://hooks.example/..."
min_keeper_sol = 0.5
lease_path = "/tmp/carrera-keeper.lease"
lease_ttl_secs = 90
status_bind = "127.0.0.1:8787"           # HTTP status server (GET /status, /history, /healthz)
# history_path = "/var/lib/carrera/history.jsonl"   # append every fast-loop sample here

