# carrera-keeper configuration. Copy to keeper.toml.
rpc_url = "https://api.mainnet-beta.solana.com"
keypair_path = "~/.config/solana/keeper.json"
program_id = "GH45ANLzg1t6rNnaoNqE39rN1rKGXFQXPZnNxvbhUmYw"   # carrera_overlay
usdc_mint = "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"
kamino_reserve = "97zoywd8mPZsGTg8q1wdD2Wgkdrs2tqusp1Qqcxbyj7E"  # Kamino xStocks market USDC reserve (rates on chain; Kamino block)
# treasury_shares = "..."    # share token account that receives performance fees; fees skipped when unset
hourly_interval_secs = 3600
fast_interval_secs = 60
settle_interval_secs = 300                # settlement pass: unwind / repay as needed, close + settle due exit epochs
# Market-open flag written on-chain by the hourly pass:
#   "auto"   NYSE cash session AND Phoenix market state (spec §7.5)
#   "open"   force true and never flip it false, so exit-driven unwinds can settle outside
#            cash hours. Bypasses spec §7.5. Demo only; do not use with real deposits.
#   "closed" force false
market_open = "open"
# alert_webhook_url = "https://hooks.example/..."
min_keeper_sol = 0.5
lease_path = "/tmp/carrera-keeper.lease"
lease_ttl_secs = 90
status_bind = "127.0.0.1:8787"           # HTTP status server (GET /status, /history, /healthz)
# history_path = "/var/lib/carrera/history.jsonl"   # append every fast-loop sample here

# Where the hourly inputs come from (see README "Feeds"):
#   "live"    keeper fetches Phoenix funding, Kamino rates and Jupiter prices and passes them
#             to the program — needs a program built with `mock-venues` (mainnet tonight)
#   "mock"    keeper reads `mock_path` (localnet)
#   "onchain" program reads Hawkeye / Kamino / oracle accounts itself (non-mock build)
feed = "live"
# Which program build is deployed. "mock": cranks carry no venue accounts (tonight's mainnet
# build). "real": every crank gets the Kamino + Phoenix blocks, a Jupiter route when it swaps,
# and the vault's keeper-owned lookup table; rates and price are read on chain (feed values are
# still used for funding, per DECISIONS D6).
program_build = "mock"
phoenix_api_url = "https://perp-api.phoenix.trade"
kamino_api_url = "https://api.kamino.finance"
kamino_market = "5wJeMrUYECGq41fxRESKALVcHnNX26TAWy4W98yULsua"   # Kamino "xStocks Market"
jupiter_price_url = "https://lite-api.jup.ag/price/v3"
# mock_path = "mock.example.json"

