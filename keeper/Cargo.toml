[package]
name = "carrera-keeper"
version = "0.1.0"
edition = "2021"
description = "Off-chain crank for the carrera_overlay program"

[dependencies]
anyhow = "1"
axum = "0.8"
borsh = { version = "1", features = ["derive"] }
chrono = "0.4"
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
bincode = "1"
phoenix-rise-accounts = { version = "0.6.5", default-features = false }
sha2 = "0.10"
solana-client = "2.2"
solana-sdk = "2.2"
phoenix-rise-ix = { version = "0.6.5", default-features = false }
solana-pubkey = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
